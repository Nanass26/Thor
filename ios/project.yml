# Projet Xcode généré par XcodeGen : `cd ios && xcodegen generate` (ou `make ios-gen` depuis la racine).
# Ne modifie pas DevisChat.xcodeproj à la main : il est régénéré à partir de ce fichier.
name: DevisChat
options:
  bundleIdPrefix: com.devischat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DevisChat:
    type: application
    platform: iOS
    sources:
      - path: DevisChat
    info:
      path: DevisChat/Info.plist
      properties:
        CFBundleDisplayName: DevisChat
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Le serveur tourne sur le Mac, sur le même Wi-Fi (http://<nom-du-mac>.local:8000).
        NSLocalNetworkUsageDescription: DevisChat se connecte au serveur de devis qui tourne sur ton Mac, sur le même réseau Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devischat.app
        # DEVELOPMENT_TEAM laissé vide exprès : choisis ta « Team » dans Xcode
        # (cible DevisChat → Signing & Capabilities). Voir docs/INSTALL_IPHONE.md.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  DevisChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DevisChatTests
    dependencies:
      - target: DevisChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devischat.app.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

schemes:
  DevisChat:
    build:
      targets:
        DevisChat: all
        DevisChatTests: [test]
    run:
      config: Debug
      commandLineArguments:
        # Coche cette case dans le schéma (Product → Scheme → Edit Scheme) pour le mode démo du simulateur.
        "-DEMO": false
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DevisChatTests
