<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- American Typewriter (police du devis, présente sur Mac) n'existe pas sous Linux :
     dans le PDF produit par le serveur hébergé, elle est remplacée par DejaVu Serif (libre). -->
<fontconfig>
  <alias binding="same">
    <family>American Typewriter</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
</fontconfig>
